<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paper Animator FX</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    canvas {
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 360px;
    }
    .row {
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #fff;
      font-size: 14px;
    }
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      background: #ffe600;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <canvas id="paperCanvas" width="360" height="640"></canvas>
  <div class="controls">
    <div class="row">
      <input type="text" id="topInput" value="nos qué es esto y cómo af">
    </div>
    <div class="row">
      <input type="text" id="targetInput" value="esto">
      <button onclick="updateText()">Generar</button>
    </div>
    <div class="row">
      <input type="text" id="bottomInput" value="uestra vida diaria. Se discu">
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('paperCanvas');
const ctx = canvas.getContext('2d');

let lineTop = "nos qué es esto y cómo af";
let targetWord = "esto";
let lineBottom = "uestra vida diaria. Se discu";

// Generador procedural de texturas de papel arrugado realista
function createPaperFrame(seed) {
  const offscreen = document.createElement('canvas');
  offscreen.width = canvas.width;
  offscreen.height = canvas.height;
  const oCtx = offscreen.getContext('2d');

  // Base blanco cálido/papel
  oCtx.fillStyle = '#eadecc';
  oCtx.fillRect(0, 0, offscreen.width, offscreen.height);

  // Pliegues de papel arrugado
  for (let i = 0; i < 18; i++) {
    oCtx.strokeStyle = `rgba(0, 0, 0, ${0.03 + (i % 3) * 0.02})`;
    oCtx.lineWidth = 1 + (i % 4);
    oCtx.beginPath();
    let x = (Math.sin(seed * 2 + i) * 0.5 + 0.5) * offscreen.width;
    oCtx.moveTo(x, 0);
    oCtx.lineTo(x + Math.cos(seed + i) * 120, offscreen.height);
    oCtx.stroke();
  }

  // Grano de ruido
  const imgData = oCtx.getImageData(0, 0, offscreen.width, offscreen.height);
  for (let i = 0; i < imgData.data.length; i += 4) {
    const noise = (Math.random() - 0.5) * 18;
    imgData.data[i] += noise;
    imgData.data[i+1] += noise;
    imgData.data[i+2] += noise;
  }
  oCtx.putImageData(imgData, 0, 0);

  return offscreen;
}

// 4 Cuadros pre-renderizados para Stop-Motion
const frames = [
  createPaperFrame(1.1),
  createPaperFrame(2.3),
  createPaperFrame(3.7),
  createPaperFrame(4.9)
];

let frameCounter = 0;

function drawScene() {
  // 1. Fondo de papel en movimiento (Stop-motion Jitter)
  const bg = frames[frameCounter % frames.length];
  ctx.drawImage(bg, 0, 0);

  // Micro-temblor de cámara
  const jitterX = (Math.random() - 0.5) * 2.5;
  const jitterY = (Math.random() - 0.5) * 2.5;

  ctx.save();
  ctx.translate(jitterX, jitterY);

  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2;
  const fontSize = 24;
  const fontStyle = `bold ${fontSize}px "Courier New", Courier, monospace`;
  
  ctx.font = fontStyle;
  ctx.textAlign = 'center';

  // --- CAPA 1: TEXTO DESENFOCADO (40% Blur / Opacidad reducida) ---
  ctx.save();
  ctx.filter = 'blur(3.5px)'; // Desenfoque ~40%
  ctx.fillStyle = 'rgba(20, 20, 20, 0.55)';

  // Texto superior
  ctx.fillText(lineTop, centerX, centerY - 42);

  // Texto inferior
  ctx.fillText(lineBottom, centerX, centerY + 48);

  ctx.restore();

  // --- CAPA 2: PALABRA INTERPUESTA Y ENFOCADA (JUSTO AL MEDIO) ---
  const wordMetrics = ctx.measureText(targetWord);
  const padX = 12;
  const padY = 8;
  const rectW = wordMetrics.width + (padX * 2);
  const rectH = fontSize + (padY * 2);

  // Resaltador Amarillo (Marcador analógico con bordes ligeramente irregulares)
  const markerJitter = (Math.random() - 0.5) * 1.5;
  ctx.fillStyle = '#ffe600';
  ctx.fillRect(
    centerX - (rectW / 2) + markerJitter, 
    centerY - fontSize + 2 + markerJitter, 
    rectW, 
    rectH
  );

  // Texto clave en primer plano (Sharp)
  ctx.fillStyle = '#000000';
  ctx.fillText(targetWord, centerX, centerY + 2);

  ctx.restore();
  frameCounter++;
}

function updateText() {
  lineTop = document.getElementById('topInput').value;
  targetWord = document.getElementById('targetInput').value;
  lineBottom = document.getElementById('bottomInput').value;
}

// Bucle fijado a 12 FPS para reproducir la cadencia stop-motion exacta del video
setInterval(drawScene, 1000 / 12);
</script>

</body>
</html>
